<body>
<div class='air air1'></div>
<div class='air air2'></div>
<div class='air air3'></div>
<div class='air air4'></div>
<div class="part">
  <h1>Lista de Roles</h1>
  <div class="esc-filter">
    <mat-form-field appearance="outline">
      <mat-label >Busca Aqui</mat-label>
      <input  matInput (keyup)="applyFilter($event)"  #input>
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
    <h2 class="boton" (click)="agregarRol()" >Agregar</h2>
    <h2 class="boton" (click)="abrirListaUsuarios()" >Aceptar</h2>
  </div>

  <div class="mat-elevation-z8" >
    <table mat-table [dataSource]="dataSource" matSort >

      <!-- ID Column -->
      <ng-container matColumnDef="ID" >
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let row"> {{row.idRol}} </td>
      </ng-container>

      <!-- Progress Column -->
      <ng-container matColumnDef="Rol">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Rol </th>
        <td mat-cell *matCellDef="let row"> {{row.rol}} </td>
      </ng-container>

      <ng-container matColumnDef="Funciones">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Funciones </th>
        <td mat-cell *matCellDef="let row"> {{funcionesRol(row.idRol)}} </td>
      </ng-container>



      <ng-container matColumnDef="Acciones">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Acciones </th>
        <td mat-cell *matCellDef="let row">
          <mat-icon (click)="borrarRol(row.idRol)" >delete</mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No se encontro ninguna coincidencia "{{input.value}}"</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5]" aria-label="Select page of users"></mat-paginator>
  </div>



</div>
</body>
