<body>
<div class="slider-thumb">
  <div class="content">
    <div class="logo">
      <img src="assets/logof.png">
    </div>

    <form [formGroup]="loginForm" class="formulario">

      <mat-form-field class="example-full-width">
        <mat-label>Empresa:</mat-label>
        <mat-select formControlName="myControl">
          <mat-option *ngFor="let option of options" [value]="option">
            {{ option }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="loginForm.get('myControl')?.hasError('required')">
          El valor es requerido.
        </mat-error>
      </mat-form-field>


      <mat-form-field class="form-campo" >
        <mat-label>Ingrese su usuario:</mat-label>
        <input matInput formControlName="usuario" required>
        <mat-icon matSuffix style="color: black"> person_pin</mat-icon>
        <mat-error *ngIf="loginForm.get('usuario')?.invalid">Debes ingresar un usuario valido</mat-error>
      </mat-form-field>

      <mat-form-field class="form-campo">
        <mat-label>Ingrese su contraseña: </mat-label>
        <input matInput type="{{ hidePassword ? 'password' : 'text' }}" formControlName="contrasenia" required>
        <button mat-icon-button matSuffix style="color: black" (click)="togglePasswordVisibility()">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('contrasenia')?.invalid">Debes ingresar una contraseña valida</mat-error>
      </mat-form-field>
      <div class="button">
        <button type="submit" (click)="ingresar()" style="background-color: #FFD384; color: black;" mat-raised-button >Ingresar</button>
      </div>
      <div class="recucon" >
        <h3 (click)="abrirRecucon()" *ngIf="flag">
          Recuperar contraseña
        </h3>
      </div>

    </form>
  </div>
</div>
</body>
