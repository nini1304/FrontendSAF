<div class="part">
  <h1 mat-dialog-title style="color:#FFD384">Recuperar Contraseña</h1>
  <div mat-dialog-content>
    <form [formGroup]="recuconForm" class="example-form">
      <h2>Ingrese su correo:</h2>
      <input matInput formControlName="correo" type="email"   placeholder="Ex. PowerUser" required>
      <h1></h1>
      <mat-error *ngIf="recuconForm.get('correo')?.hasError('required') ">Debes ingresar un correo valido</mat-error>
    </form>

  </div>
  <div mat-dialog-actions>
    <button mat-button style=" background-color: #940B92; color: black; margin-top: 2%;" (click)="verificarCorreo()">Enviar Correo</button>
    <button mat-button mat-dialog-close style=" background-color: #FFD384; color: black; margin-top: 2%;">Cerrar</button>
  </div>


</div>
